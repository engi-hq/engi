# Optional overlay: a local Postgres for trying Engi's Postgres mode on one host.
# Not needed when you point .env at your own Postgres.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: engi
      POSTGRES_DB: engi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env for the local Postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engi -d engi"]
      interval: 5s
      timeout: 3s
      retries: 10

  engi:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENGI_STORE_DRIVER: postgres
      ENGI_STORE_POSTGRES_DSN: postgres://engi:${POSTGRES_PASSWORD}@postgres:5432/engi?sslmode=disable

volumes:
  postgres-data:
