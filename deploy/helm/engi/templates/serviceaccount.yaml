{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "engi.serviceAccountName" . }}
  labels: {{- include "engi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if eq .Values.lease.type "kubernetes" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "engi.triggerServiceAccountName" . }}
  labels: {{- include "engi.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "engi.fullname" . }}-lease
  labels: {{- include "engi.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ .Values.lease.name | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "engi.fullname" . }}-lease
  labels: {{- include "engi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "engi.fullname" . }}-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "engi.triggerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
