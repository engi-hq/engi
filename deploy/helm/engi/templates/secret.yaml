{{- if not .Values.encryption.existingSecret }}
{{- /*
The credential encryption key, generated on first install. Upgrades keep the
key that is already in the cluster (lookup), and uninstall leaves the Secret in
place: without it stored credentials cannot be decrypted. `helm template` has no
cluster to look in, so it renders a fresh key each time.
*/}}
{{- $name := include "engi.encryptionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "engi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index ($existing.data | default dict) .Values.encryption.key) }}
  {{ .Values.encryption.key }}: {{ index $existing.data .Values.encryption.key }}
  {{- else }}
  {{ .Values.encryption.key }}: {{ printf "%s:%s" .Values.encryption.activeKeyId (randBytes 32) | b64enc }}
  {{- end }}
{{- end }}
