name: docs

# Builds the documentation site in strict mode so broken links and pages fail the
# check. Publishing happens in the engi-hq/docs repository, which builds these
# same pages to https://engi-hq.github.io/docs/. When the optional
# DOCS_DISPATCH_TOKEN secret is set (a fine-grained token with Actions: write on
# engi-hq/docs), a docs change on main asks that repository to publish at once;
# without it the site follows on the docs repository's own schedule.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/website/requirements.txt
      - run: make docs-site
      - name: Ask engi-hq/docs to publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set; engi-hq/docs publishes on its schedule."
            exit 0
          fi
          gh workflow run publish.yml -R engi-hq/docs
